version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nomini-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nomini_db
    ports:
      - "5432:5432"
    volumes:
      - nomini_pgdata:/var/lib/postgresql/data

volumes:
  nomini_pgdata:
